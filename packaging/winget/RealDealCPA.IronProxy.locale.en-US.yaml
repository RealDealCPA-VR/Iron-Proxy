ShortDescription: Switch between your AI subscription accounts from the system tray, with automatic same-provider failover.
Description: |-
  Iron-Proxy keeps a list of titled accounts per AI provider (Claude, ChatGPT/Codex, Gemini, Grok, API keys).
  When one account hits its usage limit, the next account of the same provider takes over, and the first one
  comes back when its window resets. A local proxy on 127.0.0.1 lets any OpenAI- or Anthropic-compatible tool
  use your accounts.
